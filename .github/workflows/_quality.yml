name: quality

# Static checks: lint, formatting, types. Cheapest feedback, runs first.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Lint · format · types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The setup action runs `pnpm codegen`, so GraphQL types exist before typecheck.
      - uses: ./.github/actions/setup
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: CI scripts self-test
        run: node --test "scripts/ci/*.test.mjs"
