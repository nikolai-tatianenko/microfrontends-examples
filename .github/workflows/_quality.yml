name: quality

# Static checks: lint, formatting, types. Cheapest feedback, runs first.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Lint · format · types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # commitlint reads the pull request's commits
      # The setup action runs `pnpm codegen`, so GraphQL types exist before typecheck.
      - uses: ./.github/actions/setup
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Commit messages (Conventional Commits)
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from "origin/${{ github.base_ref }}" --to HEAD
      - name: Scripts and Husky self-test
        run: pnpm test:ci-scripts
