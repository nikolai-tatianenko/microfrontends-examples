name: e2e

# Functional browser tests against the PRODUCTION build (artifact from `_build`).
# Runs inside the official Playwright image so browsers + system libs match the
# @playwright/test version. Writes reports/e2e/results.json.
on:
  workflow_call:
    inputs:
      playwright-version:
        description: Must equal the installed @playwright/test version (see scripts/ci/playwright-version.mjs).
        type: string
        required: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v${{ inputs.playwright-version }}-noble
      options: --ipc=host
    env:
      HOME: /root
      CI: "true"
      PLAYWRIGHT_JSON_OUTPUT_FILE: reports/e2e/results.json
      PLAYWRIGHT_JSON_OUTPUT_NAME: reports/e2e/results.json
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: build-dist
          path: .
      - name: Check Playwright image matches the lockfile
        env:
          EXPECTED: ${{ inputs.playwright-version }}
        run: |
          installed="$(pnpm exec playwright --version | awk '{print $2}')"
          if [ "$installed" != "$EXPECTED" ]; then
            echo "::error::Playwright image is v$EXPECTED but @playwright/test is $installed; browsers would not match."
            exit 1
          fi
      - name: E2E
        run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports-e2e
          path: reports/e2e
          if-no-files-found: warn
          retention-days: 14
      - name: Upload traces and screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
