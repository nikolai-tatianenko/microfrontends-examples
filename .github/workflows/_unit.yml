name: unit

# Unit tests per module. Each package writes
#   reports/unit/<module>/junit.xml and coverage-summary.json
on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      REPORTS_DIR: ${{ github.workspace }}/reports
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Test
        run: pnpm test
      # Upload even when tests fail: the failure table in the PR comes from these files.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports-unit
          path: reports/unit
          if-no-files-found: warn
          retention-days: 14
