<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title><%= htmlRspackPlugin.options.title %></title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 16px;
      }
      .layout {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      .panel {
        flex: 1 1 240px;
        border: 1px solid #888;
        border-radius: 8px;
        padding: 12px 16px;
      }
    </style>
  </head>
  <body>
    <h1>Vanilla microfrontends</h1>
    <div class="layout">
      <section class="panel">
        <h2>Products</h2>
        <div id="products-container">Loading…</div>
      </section>
      <section class="panel">
        <h2>Cart</h2>
        <div id="cart-container">Loading…</div>
      </section>
    </div>
  </body>
</html>
