packages:
  - "apps/*"
  - "packages/*"
  - "examples/vanilla/packages/*"

# pnpm 10 blocks dependency install scripts by default; allow only what we need.
onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@swc/core"
  - esbuild
  - unrs-resolver

# Transitive dependencies with published fixes, forced to the patched release (see `pnpm audit:prod`).
overrides:
  undici: ">=7.30.1"
  "@graphql-tools/utils": ">=12.0.2"
  lodash: ">=4.18.1"
  uuid: ">=11.1.1"
  glob: ">=14.0.2"
  minimatch: ">=11.0.1"
  "@vitest/mocker": ">=4.1.12"

# No patched picomatch exists yet; it is only reachable through vue-tsc, which never ships in a bundle.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
    # webpack is only a peer of the loaders (the bundler is Rspack, ADR 0009). Both advisories are in
    # `experiments.buildHttp`, which nothing here enables. Newer webpack breaks Module Federation (ADR 0006).
    - GHSA-8fgc-7cc6-rx7x
    - GHSA-38r7-794h-5758
