# Single public origin. Same URL layout as e2e/serve.mjs and the Rspack dev servers' proxies:
#   /                  shell
#   /_remotes/<name>/  each remote's build output (prefix stripped)
#   /graphql           API
#
# Upstreams are resolved per request (variables + resolver), not at startup. A remote that is
# down therefore yields a 502 for *its own* URLs only, and the shell's error boundary contains
# it. The gateway itself keeps running, which is what independent deploys require.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 8080;
  server_name _;

  location = /healthz {
    default_type text/plain;
    return 200 "ok";
  }

  location /graphql {
    set $api http://api:4000;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/_remotes/(?<remote>marketing|auth|dashboard|landing)/(?<rest>.*)$ {
    set $upstream http://$remote:8080;
    rewrite ^ /$rest break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
  }

  location / {
    set $shell http://shell:8080;
    proxy_pass $shell;
    proxy_set_header Host $host;
  }
}
