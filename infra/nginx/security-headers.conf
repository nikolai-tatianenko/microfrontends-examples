# Included in every location that sets its own add_header (nginx does not inherit add_header
# from the server block once a location defines one).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Same-origin everything: remotes and the API are served from this origin. 'unsafe-inline' for styles is
# required by Emotion (MUI) and Vue scoped styles; scripts stay strictly same-origin (no inline, no eval).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
