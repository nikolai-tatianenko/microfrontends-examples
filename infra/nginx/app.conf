# Serves one built app. Caching rule that makes independent deploys safe:
#   - content-hashed files never change under their URL            -> cache forever
#   - the few un-hashed entry points (remoteEntry.js, MF manifest, html) ARE the deploy
#     switch, so they must always be revalidated                    -> no-cache
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location = /healthz {
    default_type text/plain;
    return 200 "ok";
  }

  location = /remoteEntry.js {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location ~ ^/mf-(manifest|stats)\.json$ {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location ~* \.(?:js|css|svg|woff2?|png|jpg|webp)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # SPA fallback (client-side routes such as /pricing, /auth/signin).
  location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
  }
}
