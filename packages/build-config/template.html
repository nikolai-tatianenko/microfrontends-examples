<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title><%= htmlRspackPlugin.options.title %></title>
    <script>
      // Applies a saved light/dark choice before first paint so the page never flashes the other mode. The key and the
      // values mirror packages/tokens/src/mode.ts; "system" needs nothing, the stylesheet follows the OS by itself.
      try {
        var mode = localStorage.getItem("blog.mode");
        if (mode === "light" || mode === "dark")
          document.documentElement.setAttribute("data-theme", mode);
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
